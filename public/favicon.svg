<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7cfc00"/>
      <stop offset="50%" stop-color="#9dff00"/>
      <stop offset="100%" stop-color="#55cc00"/>
    </linearGradient>
    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Rounded Square -->
  <rect width="512" height="512" rx="120" fill="#060709" />
  
  <!-- Outer Glowing Shield Border -->
  <path d="M256 50 L420 120 L400 330 L256 460 L112 330 L92 120 Z" fill="#0d1117" stroke="#7cfc00" stroke-width="14" stroke-linejoin="round" filter="url(#glowEffect)" />

  <!-- Inner Dark Shield -->
  <path d="M256 80 L390 135 L375 315 L256 425 L137 315 L122 135 Z" fill="#121820" stroke="#7cfc00" stroke-width="4" stroke-opacity="0.4" />

  <!-- Stylized DT Letters (Neon Cyberpunk) -->
  <!-- D Letter -->
  <path d="M165 190 H235 C275 190 300 215 300 256 C300 297 275 322 235 322 H165 Z M195 222 V290 H230 C252 290 268 278 268 256 C268 234 252 222 230 222 Z" fill="#7cfc00" filter="url(#glowEffect)" />

  <!-- T Letter Overlay -->
  <path d="M260 190 H355 V222 H322 V322 H292 V222 H260 Z" fill="#ffffff" />
</svg>